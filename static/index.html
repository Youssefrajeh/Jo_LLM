<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk to Jo</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f4ee;
    --surface: #ffffff;
    --surface-2: #efeae0;
    --text: #1f1b16;
    --muted: #6b6258;
    --border: #ddd5c8;
    --accent: #8a3b2b;
    --accent-text: #ffffff;
    --warn: #9a5b00;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16130f;
      --surface: #201c17;
      --surface-2: #2a251f;
      --text: #ece6dc;
      --muted: #a39a8e;
      --border: #3a332b;
      --accent: #e08a6f;
      --accent-text: #1a1310;
      --warn: #e0a84a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 14px max(16px, calc((100% - 820px) / 2));
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font: 600 1.5rem/1 Georgia, "Times New Roman", serif; }
  #status { color: var(--muted); font-size: .875rem; }
  #status.bad { color: var(--warn); }

  main { overflow-y: auto; padding: 24px max(16px, calc((100% - 820px) / 2)); }
  .empty { color: var(--muted); text-align: center; margin-top: 12vh; }
  .empty p { max-width: 46ch; margin: 8px auto; }
  .empty strong { font-family: Georgia, serif; font-size: 1.25rem; color: var(--text); }

  .msg { margin: 0 0 20px; }
  .msg.user { display: flex; flex-direction: column; align-items: flex-end; }
  .bubble {
    background: var(--surface-2); border-radius: var(--radius);
    padding: 10px 14px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .attachments { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-bottom: 6px; }
  .attachments img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 10px; font-size: .8125rem;
  }

  .msg.jo .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .who { font: 600 .8125rem/1 system-ui, sans-serif; color: var(--accent); margin-bottom: 8px; letter-spacing: .02em; }
  .notes { display: grid; gap: 4px; margin-bottom: 10px; font-size: .875rem; color: var(--muted); }
  .notes .warn { color: var(--warn); }
  .notes q { color: var(--text); font-style: italic; }
  details.seen { font-size: .8125rem; color: var(--muted); margin-bottom: 10px; }
  details.seen summary { cursor: pointer; }
  details.seen pre { white-space: pre-wrap; background: var(--surface-2); padding: 8px 10px; border-radius: 8px; margin: 6px 0 0; color: var(--text); }
  .out { font: 1.0625rem/1.6 Georgia, "Times New Roman", serif; white-space: pre-wrap; overflow-wrap: anywhere; }
  .out .p { color: var(--muted); }
  .out.busy::after { content: "▍"; color: var(--accent); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .out.busy::after { animation: none; } }

  footer { padding: 12px max(16px, calc((100% - 820px) / 2)) 16px; border-top: 1px solid var(--border); background: var(--bg); }
  #pending { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  #pending:empty { display: none; }
  #pending .chip img { width: 28px; height: 28px; object-fit: cover; border-radius: 6px; }
  #pending .chip button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 2px; }

  form.composer {
    display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: end;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px;
  }
  form.composer:focus-within { border-color: var(--accent); }
  textarea {
    field-sizing: content; min-height: 2.5rem; max-height: 12rem; resize: none;
    border: 0; outline: none; background: transparent; color: inherit; font: inherit; padding: 8px 4px;
  }
  @supports not (field-sizing: content) { textarea { height: 2.75rem; } }
  .icon-btn, .send {
    height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); cursor: pointer; font: inherit; padding: 0 12px;
  }
  .icon-btn { width: 40px; padding: 0; font-size: 1.25rem; }
  .send { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 600; }
  .send:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  details.settings { margin-top: 8px; font-size: .875rem; color: var(--muted); }
  details.settings summary { cursor: pointer; width: fit-content; }
  .sliders { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 20px; margin-top: 10px; }
  .sliders label { display: grid; gap: 4px; }
  .sliders span { display: flex; justify-content: space-between; }
  .sliders output { color: var(--text); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }

  #drop {
    position: fixed; inset: 0; display: none; place-items: center; z-index: 10;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    border: 3px dashed var(--accent); font: 600 1.25rem Georgia, serif; color: var(--accent);
  }
  body.dragging #drop { display: grid; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* ---- modes ---- */
  nav.modes { display: flex; gap: 4px; margin-left: auto; background: var(--surface-2); border-radius: 10px; padding: 3px; }
  nav.modes button {
    border: 0; background: none; color: var(--muted); font: inherit; font-size: .875rem;
    padding: 6px 12px; border-radius: 8px; cursor: pointer;
  }
  nav.modes button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
  .msg.jo[data-mode="code"] .out { font: .875rem/1.55 ui-monospace, "Cascadia Code", Consolas, monospace; background: var(--surface-2); padding: 10px 12px; border-radius: 8px; }
  .msg.jo[data-mode="notes"] .out { font: inherit; }
  .sources { margin-top: 10px; font-size: .8125rem; color: var(--muted); }
  .sources summary { cursor: pointer; }
  .sources ol { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 6px; }
  .sources pre { white-space: pre-wrap; background: var(--surface-2); padding: 6px 8px; border-radius: 6px; margin: 4px 0 0; color: var(--text); font: .8125rem/1.45 system-ui, sans-serif; }
  .private { font-size: .75rem; color: var(--muted); margin: 6px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Jo</h1>
  <span id="status">connecting…</span>
  <nav class="modes" aria-label="Mode">
    <button type="button" data-mode="jo" aria-pressed="true">Shakespeare</button>
    <button type="button" data-mode="code" aria-pressed="false">My code</button>
    <button type="button" data-mode="notes" aria-pressed="false">My notes</button>
  </nav>
</header>

<main id="log" aria-live="polite">
  <div class="empty" id="empty">
    <strong id="empty-title"></strong>
    <p id="empty-text"></p>
    <p id="empty-extra"></p>
  </div>
</main>

<footer>
  <div id="pending"></div>
  <form class="composer" id="form">
    <label class="icon-btn" id="attach" title="Attach images or text files" style="display:grid;place-items:center">
      📎<span class="sr-only">Attach files</span>
      <input type="file" id="file" multiple hidden
             accept="image/*,.txt,.md,.csv,.json,.py,.js,.html,.css,.log">
    </label>
    <textarea id="prompt" rows="1" aria-label="Prompt"></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
  <p class="private" id="private-note" hidden>Runs entirely on this laptop. Nothing is sent to the internet.</p>
  <details class="settings">
    <summary>Generation settings</summary>
    <div class="sliders" data-for="jo">
      <label><span>Length (characters) <output id="o-tokens">400</output></span>
        <input type="range" id="tokens" min="50" max="2000" step="50" value="400"></label>
      <label><span>Temperature <output id="o-temperature">0.8</output></span>
        <input type="range" id="temperature" min="0.1" max="1.5" step="0.05" value="0.8"></label>
      <label><span>Top-k <output id="o-top_k">40</output></span>
        <input type="range" id="top_k" min="1" max="65" step="1" value="40"></label>
    </div>
    <div class="sliders" data-for="code" hidden>
      <label><span>Length (tokens) <output id="o-code_tokens">200</output></span>
        <input type="range" id="code_tokens" min="32" max="1024" step="16" value="200"></label>
      <label><span>Temperature <output id="o-code_temperature">0.4</output></span>
        <input type="range" id="code_temperature" min="0" max="1.2" step="0.05" value="0.4"></label>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="compare"> Also show the base model (before fine-tuning)</label>
    </div>
    <div class="sliders" data-for="notes" hidden>
      <label><span>Note chunks to retrieve <output id="o-k">4</output></span>
        <input type="range" id="k" min="1" max="10" step="1" value="4"></label>
    </div>
  </details>
</footer>

<div id="drop" aria-hidden="true">Drop images or text files for Jo</div>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), form = $("form"), promptEl = $("prompt"), sendBtn = $("send"), pendingEl = $("pending");
let pending = [];   // File objects waiting to be sent (Shakespeare mode only)
let busy = false;
let modesInfo = null;

// ---------- modes ----------
const MODES = {
  jo: {
    placeholder: "ROMEO:",
    title: "Jo writes like Shakespeare.",
    text: "Type the start of a scene, like ROMEO:, and Jo will continue it. You can also attach images, which a vision model describes in words for Jo, or text files, which Jo continues from.",
    extra: () => "Drag files anywhere onto the page, or use the paperclip.",
  },
  code: {
    placeholder: "def load_users(path):",
    title: "Code in your style.",
    text: "Start a function, class or file and a code model fine-tuned on your own projects completes it the way you would write it. Enter adds a new line; Ctrl+Enter sends.",
    extra: () => modesInfo?.code
      ? `Adapter trained on ${modesInfo.code.files} files (${modesInfo.code.tokens.toLocaleString()} tokens) on ${modesInfo.code.trained_at}.`
      : "No adapter yet. Train one with: python code_style.py train --code_dir \"path\\to\\your\\code\"",
  },
  notes: {
    placeholder: "When is my dentist appointment?",
    title: "Ask your notes.",
    text: "Questions are answered only from the .txt and .md files in your private notes folder, with the sources shown. Edit a note and the next answer uses the new version.",
    extra: () => modesInfo ? `${modesInfo.notes.files} note file(s) in ${modesInfo.notes.dir}.` : "",
  },
};
let mode = "jo";
try { const saved = localStorage.getItem("jo-mode"); if (MODES[saved]) mode = saved; } catch {}

function setMode(m) {
  mode = m;
  try { localStorage.setItem("jo-mode", m); } catch {}
  for (const b of document.querySelectorAll("nav.modes button")) b.setAttribute("aria-pressed", String(b.dataset.mode === m));
  for (const s of document.querySelectorAll(".sliders")) s.hidden = s.dataset.for !== m;
  $("attach").hidden = m !== "jo";
  $("private-note").hidden = m === "jo";
  if (m !== "jo") { pending = []; renderPending(); }
  promptEl.placeholder = MODES[m].placeholder;
  renderEmpty();
  promptEl.focus();
}

function renderEmpty() {
  if (!$("empty")) return;
  $("empty-title").textContent = MODES[mode].title;
  $("empty-text").textContent = MODES[mode].text;
  $("empty-extra").textContent = MODES[mode].extra();
}

for (const b of document.querySelectorAll("nav.modes button")) b.addEventListener("click", () => { if (!busy) setMode(b.dataset.mode); });

// ---------- status ----------
async function refreshStatus() {
  try {
    const [r, m] = await Promise.all([fetch("/api/status"), fetch("/api/modes")]);
    const s = await r.json();
    modesInfo = await m.json();
    renderEmpty();
    const el = $("status");
    if (!s.ok) { el.textContent = s.error; el.className = "bad"; return; }
    el.className = "";
    el.textContent = `${s.params_m}M parameters · val loss ${s.val_loss.toFixed(3)} · ${s.device}`;
  } catch { $("status").textContent = "server offline"; $("status").className = "bad"; }
}
refreshStatus();
setInterval(refreshStatus, 30000);

// ---------- settings ----------
for (const id of ["tokens", "temperature", "top_k", "code_tokens", "code_temperature", "k"]) {
  const input = $(id), out = $("o-" + id);
  input.addEventListener("input", () => { out.textContent = input.value; });
}

// ---------- attachments (Shakespeare mode) ----------
const isImage = (f) => f.type.startsWith("image/");

function addFiles(list) {
  if (mode !== "jo") return;
  for (const f of list) pending.push(f);
  renderPending();
}

function renderPending() {
  pendingEl.replaceChildren(...pending.map((f, i) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    if (isImage(f)) {
      const img = document.createElement("img");
      img.src = URL.createObjectURL(f); img.alt = "";
      chip.append(img);
    } else chip.append("📄");
    chip.append(f.name);
    const x = document.createElement("button");
    x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", `Remove ${f.name}`);
    x.onclick = () => { pending.splice(i, 1); renderPending(); };
    chip.append(x);
    return chip;
  }));
}

$("file").addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });

let dragDepth = 0;
addEventListener("dragenter", (e) => { if (mode === "jo" && e.dataTransfer?.types.includes("Files")) { dragDepth++; document.body.classList.add("dragging"); } });
addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("drop", (e) => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
  if (e.dataTransfer?.files.length) addFiles(e.dataTransfer.files);
});
promptEl.addEventListener("paste", (e) => {
  const files = [...e.clipboardData.files];
  if (files.length && mode === "jo") { e.preventDefault(); addFiles(files); }
});

// ---------- sending ----------
// Enter sends, Shift+Enter adds a newline; skip while an IME is composing text.
// In code mode Enter inserts a newline (code is multi-line) and Ctrl+Enter sends.
promptEl.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || e.shiftKey) return;
  if (e.isComposing || e.keyCode === 229) return;
  if (mode === "code" && !(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  form.requestSubmit();
});

async function stream(url, body, reply) {
  const res = await fetch(url, { method: "POST", body });
  if (!res.ok) throw new Error(`Server error ${res.status}`);
  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
  let buf = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += value;
    let nl;
    while ((nl = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
      if (line) handleEvent(reply, JSON.parse(line));
    }
  }
}

function formData(fields) {
  const body = new FormData();
  for (const [k, v] of Object.entries(fields)) body.append(k, v);
  return body;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (busy) return;
  const text = promptEl.value;
  const files = pending;
  if (!text.trim() && !files.length) { promptEl.focus(); return; }

  $("empty")?.remove();
  addUserMessage(text, files);
  promptEl.value = ""; pending = []; renderPending();
  setBusy(true);
  const m = mode;

  const jobs = [];
  if (m === "jo") {
    const body = formData({ prompt: text, tokens: $("tokens").value, temperature: $("temperature").value, top_k: $("top_k").value });
    for (const f of files) body.append("files", f, f.name);
    jobs.push(["/api/generate", body, "JO"]);
  } else if (m === "code") {
    const fields = { prompt: text, tokens: $("code_tokens").value, temperature: $("code_temperature").value };
    jobs.push(["/api/code", formData(fields), "YOUR STYLE"]);
    if ($("compare").checked) jobs.push(["/api/code", formData({ ...fields, base: "1" }), "BASE MODEL (before fine-tuning)"]);
  } else {
    jobs.push(["/api/ask", formData({ prompt: text, k: $("k").value }), "FROM YOUR NOTES"]);
  }

  for (const [url, body, label] of jobs) {
    const reply = addReply(m, label);
    if (m === "code") { const p = document.createElement("span"); p.className = "p"; p.textContent = text; reply.out.append(p); }
    try { await stream(url, body, reply); }
    catch (err) { note(reply, `Something went wrong: ${err.message}`, true); }
    finally { reply.out.classList.remove("busy"); }
  }
  setBusy(false);
  promptEl.focus();
});

function setBusy(b) { busy = b; sendBtn.disabled = b; sendBtn.textContent = b ? "Writing…" : "Send"; }

function handleEvent(r, ev) {
  switch (ev.type) {
    case "status": r.status.textContent = ev.message; break;
    case "info": note(r, ev.message); break;
    case "caption": {
      const row = document.createElement("div");
      row.append(`${ev.file}, the vision model sees: `);
      const q = document.createElement("q"); q.textContent = ev.caption; row.append(q);
      r.notes.append(row); r.status.textContent = ""; break;
    }
    case "file": note(r, `Read ${ev.file} (${ev.chars.toLocaleString()} characters)`); break;
    case "warning": note(r, ev.message, true); break;
    case "error": note(r, ev.message, true); break;
    case "prompt": {
      r.status.textContent = "";
      const d = document.createElement("details"); d.className = "seen";
      const extra = [ev.truncated && "cut to the last 256 characters", ev.dropped > 0 && `${ev.dropped} unknown characters removed`].filter(Boolean);
      d.innerHTML = `<summary>What Jo actually saw${extra.length ? " (" + extra.join(", ") + ")" : ""}</summary><pre></pre>`;
      d.querySelector("pre").textContent = ev.text;
      r.card.insertBefore(d, r.out);
      const p = document.createElement("span"); p.className = "p"; p.textContent = ev.text.trim() ? ev.text : "";
      r.out.append(p);
      break;
    }
    case "sources": {
      const d = document.createElement("details"); d.className = "sources";
      const s = document.createElement("summary");
      s.textContent = ev.hits.length ? `Sources: ${[...new Set(ev.hits.map((h) => h.source))].join(", ")}` : "No matching notes";
      const ol = document.createElement("ol");
      for (const h of ev.hits) {
        const li = document.createElement("li");
        li.textContent = `${h.source} (similarity ${h.score})`;
        const pre = document.createElement("pre"); pre.textContent = h.text; li.append(pre);
        ol.append(li);
      }
      d.append(s, ol); r.card.append(d);
      break;
    }
    case "token": r.out.append(ev.text); scrollDown(); break;
  }
}

function note(r, text, warn = false) {
  const row = document.createElement("div");
  if (warn) row.className = "warn";
  row.textContent = text; r.notes.append(row); r.status.textContent = "";
}

function addUserMessage(text, files) {
  const msg = document.createElement("div"); msg.className = "msg user";
  if (files.length) {
    const att = document.createElement("div"); att.className = "attachments";
    for (const f of files) {
      if (isImage(f)) { const img = document.createElement("img"); img.src = URL.createObjectURL(f); img.alt = f.name; att.append(img); }
      else { const c = document.createElement("span"); c.className = "chip"; c.textContent = "📄 " + f.name; att.append(c); }
    }
    msg.append(att);
  }
  if (text.trim()) { const b = document.createElement("div"); b.className = "bubble"; b.textContent = text; msg.append(b); }
  log.append(msg); scrollDown(true);
}

function addReply(m, label) {
  const msg = document.createElement("div"); msg.className = "msg jo"; msg.dataset.mode = m;
  const card = document.createElement("div"); card.className = "card";
  const who = document.createElement("div"); who.className = "who"; who.textContent = label;
  const notes = document.createElement("div"); notes.className = "notes";
  const status = document.createElement("div"); notes.append(status);
  const out = document.createElement("div"); out.className = "out busy";
  card.append(who, notes, out); msg.append(card); log.append(msg); scrollDown(true);
  return { card, notes, status, out };
}

function scrollDown(force = false) {
  const nearBottom = force || log.scrollHeight - log.scrollTop - log.clientHeight < 120;
  if (nearBottom) log.scrollTop = log.scrollHeight;
}

setMode(mode);
</script>
</body>
</html>
